# tmux.conf dedicado de agy-rc (se carga con `tmux -L agyrc -f scripts/tmux.conf`).
# Aislado de tu ~/.tmux.conf: no afecta a tus sesiones tmux normales.

# Terminal y color verdadero
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc"
set -g escape-time 10
set -g focus-events on

# Ratón: permite que la PWA haga scroll del historial con gestos (rueda SGR → copy-mode)
set -g mouse on
set -g history-limit 50000

# Sin barra de estado: la PWA ya muestra el nombre de la sesión; ganamos una fila en el móvil
set -g status off

# Tamaño de ventana según el último cliente activo (móvil + portátil conectados a la vez)
set -g window-size latest
set -g aggressive-resize on

# Las sesiones NUNCA se destruyen al desconectar el cliente; el servidor sigue aunque no haya sesiones
set -g destroy-unattached off
set -g detach-on-destroy on
set -s exit-empty off
set -s exit-unattached off

# Título de ventana = comando en curso (la API lo lee vía pane_current_command)
set -g automatic-rename on
set -g set-titles off
