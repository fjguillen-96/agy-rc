name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install tmux (needed by the tmux process tests)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      - run: npm ci
      - run: npm test
